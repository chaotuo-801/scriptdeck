appId: com.scriptdeck.app
productName: ScriptDeck
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
win:
  target:
    - nsis
    - portable
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
portable:
  artifactName: ScriptDeck-${version}-portable.exe
